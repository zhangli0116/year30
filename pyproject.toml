[project]
name = "year30"
version = "0.1.0"
description = "指数基金定投记录：FastAPI + SQLAlchemy 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0",
    "pymysql>=1.2",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "akshare>=1.18.83",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
# 默认只跑离线单测；依赖 DB/真实数据的集成回归用 `uv run pytest -m integration`
addopts = "-m 'not integration'"
markers = [
    "integration: 依赖 DB 与真实数据，需 MySQL 在跑；显式 `uv run pytest -m integration` 运行",
]
